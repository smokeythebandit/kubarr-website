name: Build Kubarr CLI binaries

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      kubarr_ref:
        description: Kubarr branch, tag, or commit to build
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: kubarr-cli-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: actions/checkout@v4
        with:
          repository: smokeythebandit/Kubarr
          ref: ${{ inputs.kubarr_ref || 'main' }}
          path: kubarr-source
      - name: Build release CLI
        run: cargo +stable build --locked --release --target ${{ matrix.target }} --manifest-path kubarr-source/code/cli/Cargo.toml
      - name: Package binary and checksum
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          asset="kubarr-linux-${ARCH}.tar.gz"
          tar -C "kubarr-source/code/cli/target/${TARGET}/release" -czf "$asset" kubarr
          sha256sum "$asset" | cut -d ' ' -f 1 > "$asset.sha256"
          mkdir release-assets
          mv "$asset" "$asset.sha256" release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: kubarr-cli-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish rolling installer binaries
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kubarr-cli-*
          path: release-assets
          merge-multiple: true
      - name: Create or update CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=kubarr-cli-latest
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Kubarr CLI installer binaries" \
              --notes "Rolling Linux CLI binaries used by https://kubarr.com/install.sh. Rebuilt from the Kubarr main branch on website deployments, or from the selected ref when manually dispatched." \
              --prerelease
          fi
          gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
